<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configuration — AK Cleaning</title>
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../css/panel.css" />
  <script src="../../config.js"></script>
  <script src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.min.js" integrity="sha384-bdZtphetAEBgkGZvhZXOFDWc55tHGLqaSo1f4qZtgvEiolEBqlJ9u6FTk+CoLfj0" crossorigin="anonymous"></script>
  <style>
    [x-cloak] { display: none !important; }
    .config-section { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: var(--space-lg); margin-bottom: var(--space-md); max-width: 880px; }
    .config-section h3 { font-size: var(--text-base); font-weight: 600; color: var(--color-primary); margin-bottom: var(--space-md); padding-bottom: var(--space-sm); border-bottom: 1px solid var(--color-divider); }
    .config-row { display: flex; justify-content: space-between; align-items: center; padding: var(--space-sm) 0; border-bottom: 1px solid var(--color-divider); gap: var(--space-md); }
    .config-row:last-child { border-bottom: none; padding-bottom: 0; }
    .config-key { font-weight: 500; color: var(--color-primary); font-size: var(--text-sm); min-width: 180px; }
    .config-val { font-size: var(--text-sm); color: var(--color-text-muted); font-family: monospace; word-break: break-all; text-align: right; }
    .config-val.redacted { letter-spacing: 2px; color: var(--color-border); }
  </style>
</head>
<body>
  <div class="panel-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <header class="header" id="header"></header>

      <div class="content">
        <div x-data="configPage()" x-init="init()" x-cloak>

          <div class="config-section">
            <h3>Company</h3>
            <template x-for="row in company" :key="row.key">
              <div class="config-row">
                <span class="config-key" x-text="row.key"></span>
                <span class="config-val" x-text="row.val"></span>
              </div>
            </template>
          </div>

          <div class="config-section">
            <h3>Supabase</h3>
            <template x-for="row in supabaseInfo" :key="row.key">
              <div class="config-row">
                <span class="config-key" x-text="row.key"></span>
                <span class="config-val" :class="row.redacted ? 'redacted' : ''"
                  x-text="row.redacted ? '••••••••••••••••' : row.val"></span>
              </div>
            </template>
          </div>

          <div class="config-section">
            <h3>Roles</h3>
            <template x-for="row in roles" :key="row.key">
              <div class="config-row">
                <span class="config-key" x-text="row.key"></span>
                <span class="config-val" x-text="row.val"></span>
              </div>
            </template>
          </div>

          <div class="config-section">
            <h3>Runtime</h3>
            <template x-for="row in runtime" :key="row.key">
              <div class="config-row">
                <span class="config-key" x-text="row.key"></span>
                <span class="config-val" x-text="row.val"></span>
              </div>
            </template>
          </div>

        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { iniciarPanel } from '../js/panel-shell.js';

    (async () => {
      const usuario = await iniciarPanel({
        rolesPermitidos: ['superadmin'],
        itemActivo: 'system-config',
        tituloHeader: 'Configuration',
      });
      if (!usuario) return;

      const CFG = window.APP_CONFIG || {};

      window.configPage = function () {
        return {
          company: [], supabaseInfo: [], roles: [], runtime: [],

          init() {
            const e = CFG.empresa || {};
            this.company = [
              { key: 'Legal name', val: e.nombre_legal || '—' },
              { key: 'Short name', val: e.nombre_corto || '—' },
              { key: 'Location',   val: e.direccion   || '—' },
              { key: 'Website',    val: e.website     || '—' },
              { key: 'Email',      val: e.email       || '—' },
              { key: 'Phone',      val: e.telefono    || '—' },
            ];

            this.supabaseInfo = [
              { key: 'Project URL', val: CFG.supabase?.url || '—' },
              { key: 'Anon Key',    val: CFG.supabase?.anon_key || '—', redacted: true },
            ];

            this.roles = Object.entries(CFG.roles || {}).map(([rol, cfg]) => ({
              key: rol,
              val: `redirect → ${cfg.redirect || '—'}`,
            }));

            this.runtime = [
              { key: 'Language', val: navigator.language },
              { key: 'Online',   val: navigator.onLine ? 'Yes' : 'No' },
              { key: 'Loaded At', val: new Date().toLocaleString('en-US') },
            ];

            this.$nextTick(() => window.lucide?.createIcons());
          },
        };
      };

      const Alpine = (await import('https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/module.esm.js')).default;
      window.Alpine = Alpine;
      Alpine.start();
      setTimeout(() => window.lucide?.createIcons(), 50);
    })();
  </script>
</body>
</html>
